<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
<title id="title">Half-kneeling overhead reach — mobility</title>
<desc id="desc">Anatomical figure in a half-kneeling lunge with an arm overhead. Blue highlights illustrate the side of the trunk and front of the rear hip.</desc>
