name: Repair Backend Nginx

on:
  workflow_dispatch:

jobs:
  repair:
    name: Repair backend reverse proxy
    runs-on: ubuntu-latest

    steps:
      - name: Update backend upstream and reload Nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -euo pipefail

            image="yeahbuddy-backend:latest"
            host_conf="/etc/nginx/sites-enabled/backend.hominhduc.me.conf"
            host_backup="${host_conf}.codex-backup-$(date -u +%Y%m%dT%H%M%SZ)"

            docker image inspect "$image" >/dev/null

            docker run --rm \
              --entrypoint sh \
              -e HOST_CONF="$host_conf" \
              -e HOST_BACKUP="$host_backup" \
              -v /etc/nginx:/host/etc/nginx:rw \
              "$image" \
              -c '
                set -eu
                conf="/host${HOST_CONF}"
                backup="/host${HOST_BACKUP}"
                old="proxy_pass http://127.0.0.1:3000/;"
                new="proxy_pass http://127.0.0.1:4000/;"

                test -f "$conf"
                old_count=$(grep -Fc "$old" "$conf" || true)
                new_count=$(grep -Fc "$new" "$conf" || true)

                if [ "$old_count" -eq 1 ] && [ "$new_count" -eq 0 ]; then
                  cp -p "$conf" "$backup"
                  sed -i "s#${old}#${new}#" "$conf"
                  echo "Updated backend upstream; backup: ${HOST_BACKUP}"
                elif [ "$old_count" -eq 0 ] && [ "$new_count" -eq 1 ]; then
                  cp -p "$conf" "$backup"
                  echo "Backend upstream already points to port 4000; backup: ${HOST_BACKUP}"
                else
                  echo "Unexpected proxy configuration (old=${old_count}, new=${new_count})" >&2
                  exit 20
                fi
              '

            if ! docker run --rm --privileged \
              --entrypoint chroot \
              -v /:/host:rw \
              "$image" \
              /host /usr/sbin/nginx -t; then
              docker run --rm \
                --entrypoint sh \
                -e HOST_CONF="$host_conf" \
                -e HOST_BACKUP="$host_backup" \
                -v /etc/nginx:/host/etc/nginx:rw \
                "$image" \
                -c 'cp -p "/host${HOST_BACKUP}" "/host${HOST_CONF}"'
              echo "Nginx validation failed; restored ${host_backup}" >&2
              exit 21
            fi

            docker run --rm --privileged \
              --entrypoint chroot \
              -v /:/host:rw \
              "$image" \
              /host /usr/sbin/nginx -s reload

            sleep 2
            curl -fsS https://backend.hominhduc.me/api/health
            echo
