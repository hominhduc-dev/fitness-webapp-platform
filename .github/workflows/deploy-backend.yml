name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-backend.yml"

concurrency:
  # Never let two deploys reach the VPS at once; a queued one runs after, not during.
  cancel-in-progress: false
  group: deploy-backend

jobs:
  verify:
    name: Verify before deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: backend/package-lock.json
          node-version: "22"

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma client
        run: npm run prisma:generate
        working-directory: backend

      - name: Typecheck
        run: npm run typecheck
        working-directory: backend

      - name: Test
        run: npm run test
        working-directory: backend

      - name: Build
        run: npm run build
        working-directory: backend

  deploy:
    name: Deploy to VPS
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          # Prefer key auth. `key` wins when VPS_SSH_KEY is set; until that secret
          # exists the action falls back to VPS_PASSWORD, so this is a safe switch.
          # Remove the password line once the deploy key is in place.
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -euo pipefail
            cd /home/yeahbuddy/htdocs/backend.hominhduc.me

            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Building Docker image..."
            docker compose build backend

            echo "==> Running Prisma migrations..."
            docker compose run --rm backend npx prisma migrate deploy

            echo "==> Restarting backend container..."
            docker compose up -d backend

            echo "==> Cleaning up dangling images..."
            docker image prune -f

            echo "==> Waiting for healthcheck..."
            for attempt in $(seq 1 20); do
              if curl -fsS http://localhost:4000/api/health >/dev/null 2>&1; then
                echo "Backend healthy after ${attempt} attempt(s)."
                exit 0
              fi
              sleep 3
            done

            echo "Healthcheck never passed — dumping logs and failing the deploy."
            docker compose ps
            docker compose logs --tail=100 backend
            exit 1
