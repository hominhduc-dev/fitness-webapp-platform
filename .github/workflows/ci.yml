name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  cancel-in-progress: true
  group: ci-${{ github.workflow }}-${{ github.ref }}

env:
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend — lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_hardening_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_hardening_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: backend/package-lock.json
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma client
        run: npm run prisma:generate
        working-directory: backend

      - name: Typecheck
        run: npm run typecheck
        working-directory: backend

      - name: Test
        run: npm run test
        working-directory: backend

      - name: Build
        run: npm run build
        working-directory: backend

      - name: Test AI transactions with PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/ai_hardening_test
          DIRECT_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/ai_hardening_test
          AI_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/ai_hardening_test
          ENV_SKIP_DOTENV: "1"
          NODE_ENV: test
        run: |
          npx prisma db push --skip-generate
          npm run test -- src/services/ai-hardening.integration.test.ts

  frontend:
    name: Frontend — typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate semantic color contract
        run: npm run lint:colors

      - name: Test
        run: npm run test

      - name: Build
        # Placeholder public config: the build only needs these to exist, and no
        # request is made to Supabase during static generation.
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
        run: npm run build

  lint:
    name: Lint (both packages)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      # The root ESLint config covers app/, components/, lib/ and backend/src/, and
      # its type-aware backend rules need backend/tsconfig.json to resolve.
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Lint
        run: npm run lint
