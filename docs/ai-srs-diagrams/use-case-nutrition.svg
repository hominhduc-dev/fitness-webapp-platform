ận lưu thực đơn dự kiến</text><path d="M125,421 L185,451 L340,451" class="edge"/><ellipse cx="570" cy="451" rx="230" ry="43" class="uc"/><text x="570" y="442" text-anchor="middle" font-size="16" font-weight="bold">UC-AI-08 / FR-AI-08</text><text x="570" y="466" text-anchor="middle" font-size="16">Xác nhận đã ăn bữa dự kiến</text><path d="M125,421 L185,563 L340,563" class="edge"/><path d="M1020,421 L955,563 L800,563" class="edge"/><ellipse cx="570" cy="563" rx="230" ry="43" class="uc"/><text x="570" y="554" text-anchor="middle" font-size="16" font-weight="bold">UC-AI-11 / FR-AI-11</text><text x="570" y="578" text-anchor="middle" font-size="16">Tạo và đọc insight dinh dưỡng</text><path d="M125,421 L185,675 L340,675" class="edge"/><path d="M1020,421 L955,675 L800,675" class="edge"/><ellipse cx="570" cy="675" rx="230" ry="43" class="uc"/><text x="570" y="666" text-anchor="middle" font-size="16" font-weight="bold">UC-AI-13 / FR-AI-13</text><text x="570" y="690" text-anchor="middle" font-size="16">Ước tính dinh dưỡng món chưa có</text></svg>